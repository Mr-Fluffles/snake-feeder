<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danger Noodle Tracker</title>
    <style>
        :root {
            --bg: #C8E6C9;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #00e676;
            --danger: #ff5252;
            --coin: #ffd700;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            transition: background 0.5s ease;
            overflow-y: auto; 
            touch-action: manipulation; 
            padding-bottom: 50px;
        }

        /* THEMES */
        body.block-theme {
            background-color: #009432;
            background-image: radial-gradient(rgba(0,0,0,0.2) 15%, transparent 16%), radial-gradient(rgba(255,255,255,0.1) 15%, transparent 16%);
            background-size: 20px 20px;
            --card: #f5f6fa; --text: #2f3640; --accent: #e84118;
        }
        body.holo-theme {
            background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 800% 800%;
            animation: holoGradient 10s ease infinite;
        }
        @keyframes holoGradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .container {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 20px;
            width: 80%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
            margin-top: 20px;
            transition: all 0.5s ease;
        }

        h1 { margin-top: 0; font-size: 1.6rem; }
        
        /* MASCOT AREA */
        .mascot-container {
            font-size: 4rem; margin-bottom: 10px; cursor: pointer;
            user-select: none; transition: transform 0.1s;
        }
        .mascot-container:active { transform: scale(0.9); }
        .hat { font-size: 0.6em; position: absolute; top: -10px; right: 0; }

        /* CURRENCY */
        .wallet {
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--coin);
            border: 1px solid var(--coin);
        }

        /* CLOSET */
        .closet-panel {
            display: none;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px dashed #666;
        }
        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .shop-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
        }
        .shop-item.owned { background: rgba(0, 230, 118, 0.2); }
        .shop-item.selected { border-color: var(--accent); }
        .shop-icon { font-size: 2rem; }
        .price-tag { font-size: 0.8rem; margin-top: 5px; color: var(--coin); }

        /* UI ELEMENTS */
        .status { font-size: 1.2rem; margin: 20px 0; padding: 15px; background: #333; border-radius: 10px; font-weight: bold; border: 1px solid #444; color: #fff; }
        body.block-theme .status { background: #fff; color: #333; }
        
        .feed-btn { background: var(--accent); color: #000; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; margin-top: 10px; }
        .secondary { background: transparent; border: 2px solid var(--accent); color: var(--accent); margin-top: 20px; border-radius: 50px; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .settings-toggle { background: none; border: none; color: #666; font-size: 1.5rem; margin-top: 20px; cursor: pointer; opacity: 0.7; }
        .settings-panel { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #444; }
        .input-group { margin: 15px 0; font-size: 1rem; color: #aaa; }
        input { background: #333; color: white; border: none; padding: 5px; border-radius: 5px; text-align: center; font-weight: bold;}
        body.block-theme input { background: #ddd; color: #333; }
        
        /* BIRTHDAY OVERLAY */
        .gift-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .brick-pile { font-size: 5rem; cursor: pointer; user-select: none; transition: transform 0.1s; margin-bottom: 20px; }
        .brick-pile:active { transform: scale(0.9); }
        .build-area { width: 200px; height: 150px; border-bottom: 4px solid #fff; display: flex; align-items: flex-end; justify-content: center; position: relative; margin-bottom: 30px; }
        .lego-brick { width: 40px; height: 20px; border: 1px solid rgba(0,0,0,0.2); position: absolute; }
        
        .gift-card-reveal {
            background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 400px;
            text-align: center; display: none; box-shadow: 0 0 50px #fff; color: #333; border: 5px solid #e84118;
        }
        .small-text { font-size: 0.8rem; color: #888; margin-top: 10px;}
    </style>
</head>
<body>

<div class="gift-overlay" id="giftOverlay">
    <div id="wrapperBox">
        <h2 style="color:white;">HAPPY 15TH BIRTHDAY!</h2>
        <div class="build-area" id="buildArea"></div>
        <div class="brick-pile" onclick="tapBrick()">🧱</div>
        <div style="color:#fbc531; font-family: monospace;">Bricks needed: <span id="tapCount">15</span></div>
    </div>
    
    <div class="gift-card-reveal" id="giftCard">
        <h2 style="color:#e84118;">🧱 MASTER BUILDER! 🧱</h2>
        <p style="font-size:1.2rem; font-weight: bold;">I got you the LEGO Flowers Bouquet Set!</p>
        <p style="color:#777; font-size:0.8rem;">(Check your DMs/Room for the real thing)</p>
        <button class="feed-btn" onclick="closeGift()" style="background:#009432;">Awesome!</button>
    </div>
</div>

<div class="container">
    <div class="wallet">
        <span>🪙</span> <span id="coinBalance">0</span> Scales
    </div>

    <div class="mascot-container" onclick="dailyBoop()">
        <span id="mascotIcon">🐍</span>
        <span id="hatIcon"></span> </div>
    
    <h1 id="titleText">Danger Noodle Tracker</h1>
    
    <div class="status" id="statusDisplay">Loading...</div>

    <button class="feed-btn" onclick="confirmFeed()">I Fed The Snek! (+50 🪙)</button>
    <p class="small-text" id="lastFedText"></p>

    <button class="secondary" onclick="toggleCloset()" style="margin-top: 10px; border-color: #aaa; color: #aaa;">🎩 Open Closet</button>

    <div class="closet-panel" id="closetPanel">
        <h3>Noodle Fashion</h3>
        <p style="font-size:0.8rem; color:#888;">Tap to Equip or Buy</p>
        <div class="shop-grid" id="shopGrid">
            </div>
    </div>

    <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
        <div class="input-group">Feed every <input type="number" id="interval" value="21" onchange="saveSettings()"> days</div>
        <div class="input-group">At <input type="time" id="feedTime" value="09:00" onchange="saveSettings()"></div>
        <button class="secondary" onclick="addToCalendar()">📅 Update Calendar</button>

        <span class="theme-label" style="display:block; margin-top:15px; color:#888;">Theme:</span>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:5px;">
            <button onclick="setTheme('#C8E6C9')" style="width:30px; height:30px; background:#C8E6C9; border-radius:50%; border:none;"></button>
            <button onclick="setTheme('#E1BEE7')" style="width:30px; height:30px; background:#E1BEE7; border-radius:50%; border:none;"></button>
            <button onclick="enableBlock()" style="width:30px; height:30px; background:#009432; border-radius:50%; border:2px solid gold; cursor:pointer;">🧱</button>
        </div>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let scales = parseInt(localStorage.getItem('scales') || 0);
    let inventory = JSON.parse(localStorage.getItem('inventory') || '["none"]');
    let currentHat = localStorage.getItem('currentHat') || 'none';
    let lastBoop = localStorage.getItem('lastBoop');

    const ITEMS = [
        { id: 'none', icon: '❌', price: 0, name: 'None' },
        { id: 'tophat', icon: '🎩', price: 50, name: 'Fancy' },
        { id: 'cowboy', icon: '🤠', price: 100, name: 'Yeehaw' },
        { id: 'bow', icon: '🎀', price: 150, name: 'Pretty' },
        { id: 'cool', icon: '😎', price: 200, name: 'Cool' },
        { id: 'crown', icon: '👑', price: 300, name: 'Royal' },
        { id: 'party', icon: '🥳', price: 500, name: 'Party' }
    ];

    // --- INIT ---
    updateWallet();
    renderMascot();
    
    // Check Date for Birthday
    checkBirthday();
    
    // Standard Tracker Init
    const savedInterval = localStorage.getItem('interval');
    if (savedInterval) document.getElementById('interval').value = savedInterval;
    updateDisplay();
    
    // Theme Init
    const savedColor = localStorage.getItem('themeColor');
    if(savedColor === 'block') enableBlock(false);
    else setTheme(savedColor || '#C8E6C9', false);


    // --- CURRENCY & SHOP LOGIC ---
    function updateWallet() {
        document.getElementById('coinBalance').innerText = scales;
        localStorage.setItem('scales', scales);
    }

    function dailyBoop() {
        const today = new Date().toDateString();
        if (lastBoop !== today) {
            scales += 10;
            lastBoop = today;
            localStorage.setItem('lastBoop', today);
            updateWallet();
            alert("Daily Boop! +10 Scales 🪙");
            
            // Animation
            const m = document.querySelector('.mascot-container');
            m.style.transform = "scale(1.2) rotate(10deg)";
            setTimeout(() => m.style.transform = "scale(1) rotate(0deg)", 200);
        } else {
            // Just wiggle if already booped
            const m = document.querySelector('.mascot-container');
            m.style.transform = "rotate(-10deg)";
            setTimeout(() => m.style.transform = "rotate(0deg)", 100);
        }
    }

    function toggleCloset() {
        const panel = document.getElementById('closetPanel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'block';
            renderShop();
        }
    }

    function renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = "";
        
        ITEMS.forEach(item => {
            const owned = inventory.includes(item.id);
            const div = document.createElement('div');
            div.className = `shop-item ${owned ? 'owned' : ''} ${currentHat === item.id ? 'selected' : ''}`;
            div.onclick = () => handleItemClick(item);
            
            div.innerHTML = `
                <div class="shop-icon">${item.icon}</div>
                <div class="price-tag">${owned ? 'Owned' : item.price + ' 🪙'}</div>
            `;
            grid.appendChild(div);
        });
    }

    function handleItemClick(item) {
        if (inventory.includes(item.id)) {
            // Equip
            currentHat = item.id;
            localStorage.setItem('currentHat', currentHat);
            renderMascot();
            renderShop(); // Refresh UI to show selected border
        } else {
            // Buy
            if (scales >= item.price) {
                if(confirm(`Buy ${item.name} for ${item.price} Scales?`)) {
                    scales -= item.price;
                    inventory.push(item.id);
                    localStorage.setItem('inventory', JSON.stringify(inventory));
                    currentHat = item.id;
                    localStorage.setItem('currentHat', currentHat);
                    updateWallet();
                    renderMascot();
                    renderShop();
                }
            } else {
                alert("Not enough Scales! Go feed the snake.");
            }
        }
    }

    function renderMascot() {
        const hatObj = ITEMS.find(i => i.id === currentHat);
        // If it's a "face" emoji (cowboy, cool, party), we REPLACE the snake face
        // If it's a "hat" emoji (tophat, crown, bow), we try to layer it? 
        // Actually, simple is better: Just replace the "Hat Icon" span next to the snake.
        // Wait, the user wants DRESS UP.
        // Let's make it: Snake Emoji + Hat Emoji next to it.
        
        if (currentHat === 'none') {
            document.getElementById('mascotIcon').innerText = "🐍";
            document.getElementById('hatIcon').innerText = "";
        } else {
            // Some emojis work better as replacements, some as addons
            if (['cowboy','cool','party'].includes(currentHat)) {
                 // For faces, we might just put the face NEXT to the snake?
                 // Or we keep the snake and put the hat next to it.
                 document.getElementById('mascotIcon').innerText = "🐍";
                 document.getElementById('hatIcon').innerText = hatObj.icon;
            } else {
                document.getElementById('mascotIcon').innerText = "🐍";
                document.getElementById('hatIcon').innerText = hatObj.icon;
            }
        }
    }

    // --- BIRTHDAY LOGIC ---
    function checkBirthday() {
        const today = new Date();
        const month = today.getMonth(); // 0 = Jan
        const day = today.getDate();
        
        // Jan 26th or 27th
        if (month === 0 && (day === 26 || day === 27)) {
            // Check if already opened THIS YEAR
            const yearKey = `bday_${today.getFullYear()}`;
            if (!localStorage.getItem(yearKey)) {
                triggerBirthdayMode();
            }
        }
    }

    // Call this manually in console to test: triggerBirthdayMode()
    function triggerBirthdayMode() {
        document.getElementById('giftOverlay').style.display = 'flex';
        // Add Party Hat to inventory automatically
        if(!inventory.includes('party')) {
            inventory.push('party');
            localStorage.setItem('inventory', JSON.stringify(inventory));
        }
    }

    // DEBUG: Uncomment below to test birthday mode TODAY
    // triggerBirthdayMode(); 

    // --- BIRTHDAY MINIGAME ---
    let taps = 15;
    function tapBrick() {
        taps--;
        document.getElementById('tapCount').innerText = taps;
        
        const b = document.createElement('div');
        b.className = 'lego-brick';
        b.style.backgroundColor = ['red','blue','green','yellow'][Math.floor(Math.random()*4)];
        b.style.bottom = (Math.random() * 100) + 'px';
        b.style.left = (Math.random() * 150) + 'px';
        document.getElementById('buildArea').appendChild(b);

        if (taps <= 0) {
            document.getElementById('wrapperBox').style.display = 'none';
            document.getElementById('giftCard').style.display = 'block';
            
            // Mark as opened for this year
            const yearKey = `bday_${new Date().getFullYear()}`;
            localStorage.setItem(yearKey, 'true');
        }
    }
    function closeGift() {
        document.getElementById('giftOverlay').style.display = 'none';
        enableBlock(); // Turn on Lego theme
    }

    // --- TRACKER LOGIC ---
    function confirmFeed() { 
        if(confirm("Confirm feeding?")) {
            feedSnake();
        }
    }
    function feedSnake() {
        localStorage.setItem('lastFed', new Date().toISOString());
        localStorage.setItem('interval', document.getElementById('interval').value);
        
        // Reward
        scales += 50;
        updateWallet();
        alert("Yum! +50 Scales 🪙");
        
        updateDisplay();
    }
    function updateDisplay() {
        const last = localStorage.getItem('lastFed');
        const int = parseInt(document.getElementById('interval').value)||21;
        if(!last) return;
        
        const next = new Date(new Date(last));
        next.setDate(next.getDate()+int);
        const diff = Math.ceil((next - new Date())/(1000*60*60*24));
        
        document.getElementById('lastFedText').innerText = "Last: "+new Date(last).toLocaleDateString();
        const stat = document.getElementById('statusDisplay');
        
        if (diff <= 0) { 
            stat.innerHTML = "🍽️ FEED NOW!"; 
            stat.style.color = "var(--danger)"; 
        } else { 
            stat.innerHTML = `Next feed in <b>${diff} days</b>`; 
            stat.style.color = "var(--accent)"; // Note: accent might be red in block theme, green in default
        }
    }

    // --- THEMES ---
    function setTheme(color, save=true) {
        document.body.className = ''; // reset
        document.documentElement.style.setProperty('--bg', color);
        document.documentElement.style.setProperty('--card', '#1e1e1e');
        document.documentElement.style.setProperty('--text', '#e0e0e0');
        if(save) localStorage.setItem('themeColor', color);
    }
    function enableBlock(save=true) {
        document.body.className = 'block-theme';
        if(save) localStorage.setItem('themeColor', 'block');
    }

    function toggleSettings() {
        const p = document.getElementById('settingsPanel');
        p.style.display = p.style.display==='block'?'none':'block';
    }
    function saveSettings() { 
        localStorage.setItem('interval', document.getElementById('interval').value); 
        updateDisplay(); 
    }
    function addToCalendar() { alert("Calendar logic active."); }
</script>
</body>
</html>
